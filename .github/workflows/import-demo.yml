name: Finalize Bucho Denti
on:
  push:
    paths: ['.github/workflows/import-demo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Bucho variables
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('995514593000','995597010317')
          s=s.replace("s.price + ' ₾'", "s.price + ' $'")
          s=s.replace("sum + ' ₾'", "sum + ' $'")
          s=s.replace("discountAmount + ' ₾", "discountAmount + ' $")
          s=s.replace("total + ' ₾'", "total + ' $'")
          s=s.replace("s.price + ' \\u20BE'", "s.price + ' $'")
          s=s.replace("total + ' \\u20BE'", "total + ' $'")
          s=re.sub(r"function calcDiscountRate\(count\) \{.*?\n  \}", "function calcDiscountRate(count) {\n    return 0;\n  }", s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Finalize Bucho Denti variables'
          git push
