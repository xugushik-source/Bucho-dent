name: Bucho Denti GEL
on:
  push:
    paths: ['.github/workflows/import-demo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch all price labels to Georgian lari
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          dollar = chr(36)
          s = s.replace(' ' + dollar, ' ₾')
          s = s.replace(dollar, '₾')
          s = s.replace('USD', 'GEL')
          p.write_text(s, encoding='utf-8')

          r = Path('README.md')
          t = r.read_text(encoding='utf-8').replace('USD', 'GEL / Georgian lari (₾)')
          r.write_text(t, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html README.md
          git diff --cached --quiet || git commit -m 'Use GEL for all Bucho Denti prices'
          git push
