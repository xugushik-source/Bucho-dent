name: Normalize Bucho Denti
on:
  push:
    paths: ['.github/workflows/import-demo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize labels
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(' ₾',' $').replace('\\u20BE','$')
          s=s.replace('კალკულატორი ავტომატურად დაითვლის ფასდაკლებას','კალკულატორი ავტომატურად დაითვლის არჩეული მომსახურებების ჯამს')
          s=s.replace('калькулятор ниже посчитает скидку','калькулятор ниже посчитает общую стоимость')
          s=s.replace('the calculator below will work out the discount automatically','the calculator below will calculate the total')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Normalize Bucho Denti USD labels'
          git push
